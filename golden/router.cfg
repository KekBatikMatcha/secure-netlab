### section firewall
*filter
:INPUT DROP
:FORWARD DROP
:OUTPUT ACCEPT
-A INPUT -i lo -j ACCEPT
-A INPUT -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
-A FORWARD -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
-A FORWARD -s 10.10.10.0/24 -d 10.10.20.0/24 -p tcp -m tcp --dport 8080 -m conntrack --ctstate NEW -j ACCEPT
-A FORWARD -s 10.10.30.0/24 -d 10.10.20.0/24 -p tcp -m tcp --dport 8080 -m conntrack --ctstate NEW -j ACCEPT
-A FORWARD -s 10.10.20.0/24 -d 10.10.40.0/24 -p tcp -m tcp --dport 502 -m conntrack --ctstate NEW -j ACCEPT
-A FORWARD -s 10.10.30.0/24 -d 10.10.40.0/24 -p tcp -m tcp --dport 502 -m conntrack --ctstate NEW -j ACCEPT
COMMIT
