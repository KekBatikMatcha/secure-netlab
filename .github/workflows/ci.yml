name: CI

# Runs on every push and pull request.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-unit:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      # Pure Python checks: config parsing, drift logic, exporter, traffic-tool guard, rule syntax.
      # No Docker needed.
      - name: Unit tests
        run: pytest -m "not integration"

  lab-integration:
    name: Lab integration tests
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      # Builds and starts the whole lab (routers, endpoints, Suricata, monitoring) on the runner.
      - name: Start the lab
        run: make up

      # The monitoring and IDS tests read reports/state.json and eve.json, so produce them first.
      - name: Back up devices (writes reports/state.json)
        run: python -m automation check

      - name: Integration tests
        run: make integration

      - name: Tear down the lab
        if: always()
        run: make down
