[project]
name = "secure-netlab"
version = "0.1.0"
description = "Secure network automation and monitoring lab (Docker Compose, localhost only)"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import order, B: bugbear, UP: pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lab modules live outside the package; make them importable in tests.
pythonpath = [".", "lab/modbus-sim", "lab/tools", "scripts"]
addopts = "-ra"
markers = [
    "integration: needs the Docker lab running (make up); run with -m integration",
]
