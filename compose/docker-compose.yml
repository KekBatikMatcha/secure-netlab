# Secure Network Automation & Monitoring Lab - Phase 1 topology.
# Everything is on internal networks: no published ports, nothing reachable from the host.
# See docs/topology.md for the diagram and the allow/deny matrix.
name: secure-netlab

x-endpoint: &endpoint
  build:
    context: ../lab
    dockerfile: host/Dockerfile
  restart: unless-stopped
  # NET_ADMIN lets the container replace its default route to the segment router.
  cap_add:
    - NET_ADMIN

services:
  # Segment router/firewall. Attached to all four segments at .1; forwarding is enabled here.
  router:
    build:
      context: ../lab/router
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      user:
        ipv4_address: 10.10.10.1
      server:
        ipv4_address: 10.10.20.1
      management:
        ipv4_address: 10.10.30.1
      industrial:
        ipv4_address: 10.10.40.1
    healthcheck:
      # Healthy only once the FORWARD default policy is DROP (rules applied).
      test: ["CMD", "sh", "-c", "iptables -S FORWARD | grep -q '^-P FORWARD DROP'"]
      interval: 2s
      timeout: 3s
      retries: 15

  # User segment: simulated employee PC.
  user-pc:
    <<: *endpoint
    command: sh -c "ip route replace default via 10.10.10.1 && exec python -m http.server 8080 -d /srv/www"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8080), 1)"]
      interval: 2s
      retries: 15
    networks:
      user:
        ipv4_address: 10.10.10.10

  # Server segment: simulated application/historian server.
  app-server:
    <<: *endpoint
    command: sh -c "ip route replace default via 10.10.20.1 && exec python -m http.server 8080 -d /srv/www"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8080), 1)"]
      interval: 2s
      retries: 15
    networks:
      server:
        ipv4_address: 10.10.20.10

  # Management segment: simulated engineering workstation.
  eng-ws:
    <<: *endpoint
    command: sh -c "ip route replace default via 10.10.30.1 && exec python -m http.server 8080 -d /srv/www"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8080), 1)"]
      interval: 2s
      retries: 15
    networks:
      management:
        ipv4_address: 10.10.30.10

  # Industrial segment: simulated Modbus/TCP PLC (see lab/modbus-sim).
  plc:
    build:
      context: ../lab/modbus-sim
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    command: sh -c "ip route replace default via 10.10.40.1 && exec python /opt/modbus/modbus_server.py --port 502"
    volumes:
      # Read-only probe tools so tests can check the PLC's egress is blocked.
      - ../lab/tools:/opt/tools:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 502), 1)"]
      interval: 2s
      retries: 15
    networks:
      industrial:
        ipv4_address: 10.10.40.10

  # Intrusion detection. Shares the router's network namespace, so it sees traffic on all four
  # segments as the router receives it. Pcap mode on "any" with the BPF filter "inbound" gives one
  # copy of each packet (forwarded packets would otherwise be seen on both interfaces).
  # NET_RAW is the only capability: without NET_ADMIN/SYS_NICE the image's entrypoint runs as root
  # and does not chown the bind-mounted log directory. -k none turns off checksum validation, since
  # packets captured before checksum offload can look invalid in a VM.
  suricata:
    image: jasonish/suricata:7.0.11
    restart: unless-stopped
    network_mode: "service:router"
    depends_on:
      router:
        condition: service_healthy
    cap_add:
      - NET_RAW
    command:
      - -c
      - /etc/suricata/suricata.yaml
      - -S
      - /etc/suricata/rules/lab.rules
      - --pcap=any
      - -l
      - /var/log/suricata
      - -k
      - none
      - inbound
    volumes:
      - ../lab/suricata/rules:/etc/suricata/rules:ro
      - ../reports/suricata:/var/log/suricata

  # Uptime/latency monitor (management segment). Probes allowed flows through the router and
  # exports Prometheus metrics on :9101. Reads the backup state written by `python -m automation`.
  monitor:
    build:
      context: ..
      dockerfile: monitor/Dockerfile
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    command: sh -c "ip route replace default via 10.10.30.1 && exec python -m monitor.app --targets /app/monitor/targets.yaml --state /state/state.json --eve /var/log/suricata/eve.json"
    volumes:
      - ../reports:/state:ro
      - ../reports/suricata:/var/log/suricata:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9101/metrics', timeout=2)"]
      interval: 5s
      retries: 20
    networks:
      management:
        ipv4_address: 10.10.30.20

  # Prometheus scrapes the monitor and evaluates alert rules (lab/prometheus). UI on localhost only.
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    volumes:
      - ../lab/prometheus:/etc/prometheus:ro
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      management:
        ipv4_address: 10.10.30.30

  # Grafana with provisioned datasource and dashboard (lab/grafana). UI on localhost only.
  # Anonymous Viewer access is enabled so the dashboard can be viewed without logging in.
  # This is acceptable only because the port is bound to 127.0.0.1. Editing requires the admin login.
  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-FAKE-lab-grafana-pass}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ../lab/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../lab/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      management:
        ipv4_address: 10.10.30.40

networks:
  # NOTE: not `internal: true`. Docker's internal-network isolation drops any IP packet leaving an
  # internal bridge toward another subnet, which blocks traffic routed through the segment router
  # (confirmed in Docker Desktop: DOCKER-INTERNAL DROP counters). Isolation here comes from the
  # router: every endpoint's default route points at its segment router, and the router only
  # forwards the allow-listed flows in lab/router/rules.sh. No ports are published to the host.
  # The explicit gateway (.254) keeps Docker's bridge address off .1, which belongs to the router.
  user:
    ipam:
      config:
        - subnet: 10.10.10.0/24
          gateway: 10.10.10.254
  server:
    ipam:
      config:
        - subnet: 10.10.20.0/24
          gateway: 10.10.20.254
  management:
    ipam:
      config:
        - subnet: 10.10.30.0/24
          gateway: 10.10.30.254
  industrial:
    ipam:
      config:
        - subnet: 10.10.40.0/24
          gateway: 10.10.40.254
